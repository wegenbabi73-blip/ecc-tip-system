<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>የኮንትሮባንድ ጥቆማ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,"Noto Sans Ethiopic",sans-serif}.glass{backdrop-filter:blur(8px)}</style>
</head>
<body class="bg-slate-100 min-h-screen">
<header class="bg-slate-950 text-white p-4 sticky top-0 z-20">
 <div class="max-w-2xl mx-auto flex justify-between items-center">
  <div><div class="font-bold">የኢትዮጵያ ጉምሩክ ኮሚሽን</div><div class="text-xs text-slate-400">የኮንትሮባንድ ጥቆማ ፖርታል</div></div>
  <span id="online" class="text-xs bg-emerald-700 px-2 py-1 rounded">Online</span>
 </div>
</header>
<main class="max-w-2xl mx-auto p-4 space-y-4">
<section class="bg-white rounded-2xl p-5 shadow-sm">
 <h1 class="text-2xl font-bold">ጥቆማ ይላኩ</h1>
 <p class="text-slate-500 text-sm mt-1">የሚያውቁትን የኮንትሮባንድ መረጃ በደህንነት ያስገቡ።</p>
 <form id="tipForm" class="space-y-3 mt-5">
  <label class="block"><span class="text-sm font-semibold">የጥቆማ ምድብ</span>
   <select id="category" class="mt-1 w-full border rounded-xl p-3" required>
    <option value="">ይምረጡ</option><option>Drugs</option><option>Weapons</option><option>Currency</option><option>Counterfeit</option><option>Illegal Trade</option><option>Operations</option><option>Other</option>
   </select>
  </label>
  <label class="block"><span class="text-sm font-semibold">ዝርዝር መረጃ</span>
   <textarea id="description" rows="6" class="mt-1 w-full border rounded-xl p-3" required placeholder="ምን እንደተመለከቱ፣ መቼ፣ የት እና ሌሎች ጠቃሚ ዝርዝሮች..."></textarea>
  </label>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
   <label><span class="text-sm font-semibold">ቦታ</span><input id="location" class="mt-1 w-full border rounded-xl p-3" placeholder="ከተማ/አካባቢ"></label>
   <label><span class="text-sm font-semibold">የአደጋ ደረጃ</span><select id="risk" class="mt-1 w-full border rounded-xl p-3"><option>Medium</option><option>Low</option><option>High</option></select></label>
  </div>
  <label><span class="text-sm font-semibold">የመገናኛ መረጃ (አማራጭ)</span><input id="contact" class="mt-1 w-full border rounded-xl p-3" placeholder="ስልክ/ኢሜይል"></label>
  <label class="block"><span class="text-sm font-semibold">ፎቶ/ፋይል (አማራጭ)</span><input id="attachment" type="file" accept="image/*,.pdf,.doc,.docx" class="mt-1 w-full border rounded-xl p-3 bg-white"></label>
  <div class="grid grid-cols-2 gap-3">
   <button type="button" onclick="useLocation()" class="border border-slate-300 rounded-xl p-3">📍 ቦታ ለመጠቀም</button>
   <button class="bg-blue-700 text-white rounded-xl p-3 font-semibold">ጥቆማውን ላክ</button>
  </div>
 </form>
 <p id="msg" class="mt-4 text-sm"></p>
</section>

<section class="bg-white rounded-2xl p-5 shadow-sm">
 <h2 class="font-bold text-lg">ጥቆማ መከታተያ</h2>
 <div class="flex gap-2 mt-3"><input id="trackCode" class="flex-1 border rounded-xl p-3" placeholder="ECC-..."><button onclick="track()" class="bg-slate-900 text-white px-4 rounded-xl">ፈልግ</button></div>
 <div id="trackResult" class="mt-3 text-sm"></div>
</section>

<section id="queueBox" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4">
 <b>Offline ጥቆማዎች</b>
 <p class="text-sm text-amber-800 mt-1">ግንኙነት ሲመለስ የተቀመጡ ጥቆማዎች ለመላክ ይሞከራሉ።</p>
 <button onclick="flush()" class="mt-2 bg-amber-700 text-white rounded-lg px-3 py-2">አሁን ላክ</button>
 <span id="qcount" class="ml-2 text-sm"></span>
</section>
</main>
<script src="api.js"></script>
<script>
function updateOnline(){online.textContent=navigator.onLine?"Online":"Offline";online.className=navigator.onLine?"text-xs bg-emerald-700 px-2 py-1 rounded":"text-xs bg-amber-700 px-2 py-1 rounded";queueBox.classList.toggle("hidden",eccQueue().length===0);qcount.textContent=eccQueue().length+" queued";}
window.addEventListener("online",()=>{updateOnline();flush()});window.addEventListener("offline",updateOnline);updateOnline();

async function useLocation(){
 if(!navigator.geolocation){msg.textContent="የLocation አገልግሎት አይደገፍም።";return}
 navigator.geolocation.getCurrentPosition(p=>{location.value=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`},()=>{msg.textContent="Location ለመጠቀም ፈቃድ አልተሰጠም።"});
}
tipForm.addEventListener("submit",async e=>{
 e.preventDefault();msg.className="mt-4 text-sm";msg.textContent="በመላክ ላይ...";
 const fields={category:category.value,description:description.value,location:location.value,risk_level:risk.value,contact:contact.value};
 const file=attachment.files[0];
 try{
   const fd=new FormData();Object.entries(fields).forEach(([k,v])=>fd.append(k,v));if(file)fd.append("attachment",file);
   const d=await eccApi("/tips",{method:"POST",body:fd});
   msg.className="mt-4 text-sm text-emerald-700 font-semibold";
   msg.innerHTML=`ጥቆማው ተልኳል።<br>Tracking Code: <b>${d.trackingCode}</b>`;
   tipForm.reset();updateOnline();
 }catch(err){
   const fileData=file?await file.arrayBuffer().then(b=>Array.from(new Uint8Array(b)).slice(0,0)):null;
   eccQueueTip({fields});
   msg.className="mt-4 text-sm text-amber-700 font-semibold";
   msg.textContent="Server አልተገኘም። ጥቆማው በዚህ መሣሪያ ተጠብቆ ግንኙነት ሲመለስ ይላካል።";
   tipForm.reset();updateOnline();
 }
});
async function flush(){try{const r=await eccFlushQueue();msg.textContent=r.sent?`${r.sent} ጥቆማ ተልኳል።`:msg.textContent;updateOnline()}catch(e){}}
async function track(){trackResult.textContent="...";try{const d=await eccApi("/tips/track/"+encodeURIComponent(trackCode.value.trim()));trackResult.innerHTML=`<div class="border rounded-xl p-3"><b>${d.tracking_code}</b><br>ምድብ: ${d.category}<br>Risk: ${d.risk_level}<br>Status: ${d.status}<br>ቀን: ${d.created_at}</div>`}catch(e){trackResult.textContent=e.message}}
</script>
</body></html>
