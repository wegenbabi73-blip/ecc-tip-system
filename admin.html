<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECC Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body class="bg-slate-100 text-slate-900"><header class="bg-slate-950 text-white p-4"><div class="max-w-7xl mx-auto flex items-center justify-between">
<div><h1 class="font-bold text-xl">ECC — Admin Dashboard</h1><span id="who" class="text-xs text-slate-400"></span></div>
<div class="flex gap-2 items-center"><button onclick="toggleNotifs()" class="relative bg-slate-800 px-3 py-2 rounded">🔔<span id="badge" class="absolute -top-2 -right-2 bg-red-600 rounded-full text-xs px-1.5 hidden">0</span></button><a href="reports.html" class="bg-emerald-600 px-3 py-2 rounded">Reports</a><a href="users.html" class="bg-blue-600 px-3 py-2 rounded">Users</a><button onclick="eccLogout()" class="bg-slate-700 px-3 py-2 rounded">Logout</button></div></div></header>
<div id="notifs" class="hidden fixed right-4 top-16 w-96 max-w-[calc(100%-2rem)] bg-white shadow-xl rounded-xl border p-3 z-50"><div class="flex justify-between mb-2"><b>Notifications</b><button onclick="markAll()" class="text-sm text-blue-600">Mark all read</button></div><div id="notifList" class="space-y-2 max-h-80 overflow-auto"></div></div>
<main class="max-w-7xl mx-auto p-4"><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="bg-white rounded-xl p-4"><div class="text-slate-500 text-sm">Total</div><b id="total" class="text-2xl">0</b></div><div class="bg-white rounded-xl p-4"><div class="text-slate-500 text-sm">New/Checking</div><b id="checking" class="text-2xl">0</b></div><div class="bg-white rounded-xl p-4"><div class="text-slate-500 text-sm">High</div><b id="high" class="text-2xl">0</b></div><div class="bg-white rounded-xl p-4"><div class="text-slate-500 text-sm">Operations</div><b id="ops" class="text-2xl">0</b></div></div>
<div class="bg-white rounded-xl p-4 mb-4"><input id="q" oninput="load()" class="w-full md:w-1/2 p-3 border rounded" placeholder="Search tracking/category/location..."></div>
<div class="bg-white rounded-xl p-4 overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b"><th class="p-2 text-left">Tracking</th><th class="p-2 text-left">Category</th><th class="p-2">Risk</th><th class="p-2">Status</th><th class="p-2">Created</th><th class="p-2">View</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script src="api.js"></script><script>
const user=eccCurrentUser();if(!user||!localStorage.getItem("ecc_access_token"))location.href="login.html";who.textContent=`${user?.username||""} • ${user?.role||""}`;
async function load(){try{const d=await eccApi("/tips?q="+encodeURIComponent(q.value));total.textContent=d.length;checking.textContent=d.filter(x=>["New","Checking"].includes(x.status)).length;high.textContent=d.filter(x=>x.risk_level==="High").length;ops.textContent=d.filter(x=>x.category==="Operations").length;rows.innerHTML=d.map(x=>`<tr class="border-b"><td class="p-2 font-mono">${x.tracking_code}</td><td class="p-2">${x.category}</td><td class="p-2 text-center">${x.risk_level}</td><td class="p-2 text-center">${x.status}</td><td class="p-2">${x.created_at}</td><td class="p-2 text-center"><a class="text-blue-600" href="tip.html?id=${x.id}">Open</a></td></tr>`).join("")}catch(e){console.error(e)}}
async function notifications(){try{const d=await eccApi("/notifications");badge.textContent=d.unread;badge.classList.toggle("hidden",!d.unread);notifList.innerHTML=d.items.map(n=>`<div class="border rounded p-2 ${n.is_read?'opacity-60':''}"><b>${n.title}</b><div class="text-sm">${n.message}</div><button class="text-xs text-blue-600" onclick="readN(${n.id})">mark read</button></div>`).join("")}catch(e){}}
async function readN(id){await eccApi("/notifications/"+id+"/read",{method:"PATCH"});notifications()}
async function markAll(){const d=await eccApi("/notifications");for(const n of d.items.filter(x=>!x.is_read))await readN(n.id);notifications()}
function toggleNotifs(){notifs.classList.toggle("hidden");notifications()}
load();notifications();setInterval(notifications,30000);
</script>
<section class="mt-6 bg-white rounded-2xl shadow p-5">
<h2 class="text-lg font-bold">Advanced Search</h2>
<div class="grid md:grid-cols-4 gap-3 mt-4">
<input id="v7q" class="border rounded-xl p-3" placeholder="Tracking / description / location">
<select id="v7status" class="border rounded-xl p-3"><option value="">All statuses</option><option>New</option><option>Assigned</option><option>Checking</option><option>In Progress</option><option>Closed</option></select>
<select id="v7risk" class="border rounded-xl p-3"><option value="">All risks</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
<input id="v7category" class="border rounded-xl p-3" placeholder="Category">
<input id="v7region" class="border rounded-xl p-3" placeholder="Region">
<input id="v7zone" class="border rounded-xl p-3" placeholder="Zone">
<input id="v7woreda" class="border rounded-xl p-3" placeholder="Woreda">
<input id="v7from" type="date" class="border rounded-xl p-3"><input id="v7to" type="date" class="border rounded-xl p-3">
</div>
<button onclick="v7Search()" class="mt-4 px-4 py-2 rounded-xl bg-slate-900 text-white">Search</button>
<div id="v7results" class="mt-4 overflow-auto"></div>
</section>
<script>
async function v7Search(){
 const p=new URLSearchParams({q:v7q.value,status:v7status.value,risk:v7risk.value,category:v7category.value,region:v7region.value,zone:v7zone.value,woreda:v7woreda.value,date_from:v7from.value,date_to:v7to.value});
 const r=await fetch(ECC_API_BASE+'/tips?'+p,{headers:{Authorization:'Bearer '+localStorage.getItem('ecc_access_token')}});
 const d=await r.json(); if(!r.ok){v7results.innerHTML='<p class="text-red-600">'+(d.error||'Search failed')+'</p>';return;}
 v7results.innerHTML='<table class="min-w-full text-sm"><tr><th class="p-2 text-left">Tracking</th><th class="p-2 text-left">Status</th><th class="p-2 text-left">Risk</th><th class="p-2 text-left">Region</th><th class="p-2 text-left">Created</th></tr>'+
 (d.tips||[]).map(t=>'<tr class="border-t"><td class="p-2"><a class="text-blue-600 underline" href="tip.html?id='+t.id+'">'+(t.tracking_code||'')+'</a></td><td class="p-2">'+(t.status||'')+'</td><td class="p-2">'+(t.risk||'')+'</td><td class="p-2">'+(t.region||'')+'</td><td class="p-2">'+(t.created_at||'')+'</td></tr>').join('')+'</table>';
}
</script>
</body></html>
