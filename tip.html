<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Details</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100"><header class="bg-slate-950 text-white p-4"><div class="max-w-5xl mx-auto flex justify-between"><b>ECC — Tip Details</b><a href="admin.html" class="text-blue-300">← Dashboard</a></div></header>
<main class="max-w-5xl mx-auto p-4 space-y-4"><div id="msg"></div><section id="card" class="hidden bg-white rounded-2xl p-5 shadow">
<div class="flex flex-wrap justify-between gap-3"><div><h1 id="code" class="text-2xl font-bold"></h1><p id="created" class="text-slate-500 text-sm"></p></div><span id="risk" class="rounded-full px-3 py-1 bg-amber-100 h-fit"></span></div>
<div class="grid md:grid-cols-2 gap-4 mt-5"><div><b>Category</b><p id="cat"></p></div><div><b>Location</b><p id="loc"></p></div><div class="md:col-span-2"><b>Description</b><p id="desc" class="whitespace-pre-wrap bg-slate-50 p-3 rounded mt-1"></p></div></div>
<div class="grid md:grid-cols-3 gap-3 mt-5"><select id="status" class="border p-3 rounded"><option>New</option><option>Assigned</option><option>Checking</option><option>In Progress</option><option>Closed</option></select><select id="riskSelect" class="border p-3 rounded"><option>Low</option><option>Medium</option><option>High</option></select><select id="assignee" class="border p-3 rounded"><option value="">Unassigned</option></select></div>
<div class="flex gap-2 mt-3"><button onclick="save()" class="bg-blue-600 text-white rounded px-4 py-2">Save</button><button onclick="assign()" class="bg-emerald-600 text-white rounded px-4 py-2">Assign</button></div>
<h2 class="font-bold mt-6">Attachments</h2><div id="files" class="space-y-2"></div>
<div id="mapBox" class="mt-5"><h2 class="font-bold">Location</h2><iframe id="map" class="w-full h-72 rounded-xl border mt-2" loading="lazy"></iframe></div>
</section></main>
<script src="api.js"></script><script>
const id=new URLSearchParams(location.search).get("id");let tip;function escAtt(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
async function load(){try{tip=await eccApi("/tips/"+id);card.classList.remove("hidden");code.textContent=tip.tracking_code;created.textContent=tip.created_at;cat.textContent=tip.category;loc.textContent=tip.location||"—";desc.textContent=tip.description;risk.textContent=tip.risk_level;status.value=tip.status;riskSelect.value=tip.risk_level;files.innerHTML=tip.attachments.map(a=>`<button type="button" class="block w-full text-left border rounded p-3 text-blue-600" onclick="eccDownloadAttachment(${JSON.stringify(a.stored_name)},${JSON.stringify(a.original_name)})">${escAtt(a.original_name)} (${escAtt(a.mime_type)})</button>`).join("")||"<p class='text-slate-500'>No attachments</p>";if(tip.location?.includes(",")){const [lat,lon]=tip.location.split(",").map(Number);if(Number.isFinite(lat)&&Number.isFinite(lon))map.src=`https://www.openstreetmap.org/export/embed.html?bbox=${lon-.02}%2C${lat-.02}%2C${lon+.02}%2C${lat+.02}&layer=mapnik&marker=${lat}%2C${lon}`;else mapBox.classList.add("hidden")}else mapBox.classList.add("hidden");const u=await eccApi("/users/officers");assignee.innerHTML='<option value="">Unassigned</option>'+u.map(x=>`<option value="${x.id}" ${x.id===tip.assigned_to?"selected":""}>${x.username} (${x.role})</option>`).join("")}catch(e){msg.textContent=e.message}}
async function save(){try{await eccApi("/tips/"+id,{method:"PATCH",body:JSON.stringify({status:status.value,risk_level:riskSelect.value})});msg.textContent="Saved";load()}catch(e){msg.textContent=e.message}}
async function assign(){if(!assignee.value){msg.textContent="Assignee ይምረጡ";return}try{await eccApi("/tips/"+id+"/assign",{method:"PATCH",body:JSON.stringify({assigned_to:Number(assignee.value)})});msg.textContent="Assigned";load()}catch(e){msg.textContent=e.message}}
load();
</script>
<section class="mt-6 bg-white rounded-2xl shadow p-5"><h2 class="text-lg font-bold">Case History / Timeline</h2><div id="v7history" class="mt-4 space-y-3 text-sm"></div></section>
<script>
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return;try{
const r=await fetch(ECC_API_BASE+'/tips/'+id+'/history',{headers:{Authorization:'Bearer '+localStorage.getItem('ecc_access_token')}});const d=await r.json();
v7history.innerHTML=(d.history||[]).map(h=>'<div class="border-l-4 border-slate-300 pl-4"><b>'+h.action+'</b><div>'+((h.from_status||'')+' → '+(h.to_status||''))+'</div><div>'+(h.note||'')+'</div><small class="text-slate-500">'+(h.user_name||'System')+' · '+(h.created_at||'')+'</small></div>').join('')||'<span class="text-slate-500">No history yet.</span>';
}catch(e){v7history.textContent='Unable to load history';}})();
</script>
</body></html>
