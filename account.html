<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECC Account Security</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100"><main class="max-w-lg mx-auto p-4 mt-8"><div class="bg-white rounded-2xl p-6 shadow"><a href="admin.html" class="text-blue-600">← Back</a><h1 class="text-2xl font-bold mt-3">Account Security</h1><p id="u" class="text-slate-500"></p><button onclick="setup()" class="mt-5 w-full bg-blue-600 text-white p-3 rounded">Set up Authenticator MFA</button><div id="panel" class="hidden mt-4"><img id="qr" class="w-56 h-56 mx-auto"><p class="text-xs break-all text-slate-500 mt-2" id="uri"></p><input id="code" class="border p-3 rounded w-full mt-3 text-center tracking-widest" maxlength="6" placeholder="000000"><button onclick="enable()" class="w-full bg-emerald-600 text-white p-3 rounded mt-3">Enable MFA</button></div><p id="msg" class="mt-3 text-sm"></p></div></main><script src="api.js"></script><script>const me=eccCurrentUser();if(!me)location.href="login.html";u.textContent=`${me.username} • ${me.role}`;async function setup(){try{const d=await eccApi("/auth/mfa/setup",{method:"POST"});qr.src=d.qrDataUrl;uri.textContent=d.otpauth;panel.classList.remove("hidden")}catch(e){msg.textContent=e.message}}async function enable(){try{await eccApi("/auth/mfa/enable",{method:"POST",body:JSON.stringify({code:code.value})});msg.textContent="MFA enabled successfully."}catch(e){msg.textContent=e.message}}</script></body></html>
